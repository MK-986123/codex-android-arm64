# CI workflow that verifies codex binaries compile for Android arm64 on every
# push to main and on every PR.  This is intentionally separate from the
# release workflow (rust-release.yml) which only runs on tags.

name: android-arm64

on:
  push:
    branches: ["main"]
    paths:
      - "codex-rs/**"
      - ".cargo/**"
      - ".github/workflows/android-arm64.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "codex-rs/**"
      - ".cargo/**"
      - ".github/workflows/android-arm64.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build – aarch64-linux-android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # libcap-dev is required by the codex-linux-sandbox build script even
      # when cross-compiling for Android (build scripts run on the host).
      - name: Install host build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends pkg-config libcap-dev

      - uses: dtolnay/rust-toolchain@a0b273b48ed29de4470960879e8381ff45632f26 # 1.93.0
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        id: android-ndk
        uses: nttld/setup-ndk@31d5c69f6f4d0d4df5f4f81cf8e579e6b9269f78 # v1.5.0
        with:
          ndk-version: r28b

      - name: Configure Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          ndk="${{ steps.android-ndk.outputs.ndk-path }}"
          toolchain="${ndk}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          api_level=28
          echo "ANDROID_NDK_HOME=${ndk}" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${toolchain}/aarch64-linux-android${api_level}-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=${toolchain}/aarch64-linux-android${api_level}-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=${toolchain}/aarch64-linux-android${api_level}-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=${toolchain}/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB_aarch64_linux_android=${toolchain}/llvm-ranlib" >> "$GITHUB_ENV"

      # Use debug profile so CI is fast.  The release workflow already does a
      # --release build on every version tag.
      - name: Cargo build
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --target aarch64-linux-android \
            --bin codex \
            --bin codex-responses-api-proxy
